[project]
name = "sam-service"
version = "0.0.0"
description = "SAM 3.1 masks service (studio masks arc): one model, one queue, PNG matte store"
requires-python = ">=3.13"
# The service itself (server, matte store, stub backend) runs on these two
# plus the standard library: no web framework, no model. A backend adds its
# own weights and runtime through an extra below.
dependencies = [
    "numpy>=1.26",
    "pillow>=11",
]

[project.optional-dependencies]
mlx = [
    "mlx-cv[mlx,hub]==0.0.4",
]
torch = [
    "torch>=2.8",
    "torchvision>=0.19",
    "transformers>=5.9",
    "pillow>=11",
    "numpy>=1.26",
]

[tool.uv]
package = false
